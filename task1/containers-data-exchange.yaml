apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
spec:
  replicas: 1

  selector:
    matchLabels:
      app: data-exchange

  template:
    metadata:
      labels:
        app: data-exchange

    spec:
      containers:
        # Контейнер №1 — записывает информацию
        - name: busybox
          image: busybox:1.36

          command: ["/bin/sh", "-c"]
          args:
            - |
              touch /shared/data.log
              while true; do
                echo "$(date)" >> /shared/data.log
                sleep 5
              done

          volumeMounts:
            - name: shared-data
              mountPath: /shared

        # Контейнер №2 — читает информацию
        - name: multitool
          image: wbitt/network-multitool:latest

          command: ["/bin/sh", "-c"]
          args:
            - |
              tail -f /shared/data.log

          volumeMounts:
            - name: shared-data
              mountPath: /shared

      # Объявляем общее временное хранилище
      volumes:
        - name: shared-data
          emptyDir: {}