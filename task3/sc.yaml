
# 1. PersistentVolume — физическое хранилище на локальной ноде
apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-exchange-sc-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /mnt/data/k8s-storageclass
    type: DirectoryOrCreate

---
# 2. StorageClass — класс локального хранилища
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---
# 3. PersistentVolumeClaim — запрос хранилища
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-exchange-sc-pvc
spec:
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 1Gi

---
# 4. Deployment — два контейнера с общим хранилищем
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              touch /shared/data.log
              while true; do
                echo "$(date)" >> /shared/data.log
                sleep 5
              done
          volumeMounts:
            - name: persistent-data
              mountPath: /shared

        - name: multitool
          image: wbitt/network-multitool:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ -f /shared/data.log ]; do sleep 1; done
              exec tail -f /shared/data.log
          volumeMounts:
            - name: persistent-data
              mountPath: /shared

      volumes:
        - name: persistent-data
          persistentVolumeClaim:
            claimName: data-exchange-sc-pvc
